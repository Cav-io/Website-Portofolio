<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in the tall grass | Cavio Hossain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #191a4a;
      color: #fff;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .box {
      background: #fff;
      color: #23213d;
      border: 6px solid #23213d;
      box-shadow: inset 0 0 0 5px #2ec4b6, 10px 10px 0 #ff5d73;
      padding: 32px 28px;
      max-width: 560px;
      line-height: 1.9;
    }
    h1 { font-size: 40px; margin: 0 0 18px; color: #ff5d73; font-weight: 400; }
    p { font-size: 12px; margin: 0 0 14px; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 18px;
      background: #ffd23f;
      color: #23213d;
      border: 4px solid #23213d;
      box-shadow: 4px 4px 0 #23213d;
      text-decoration: none;
      font-size: 12px;
    }
    a:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 #23213d; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>You walked off the edge of the map.</p>
    <p>There is nothing out here but tall grass and wild bugs.</p>
    <a href="/">Back to Portfolio Town</a>
  </div>
</body>
</html>
